version: 2

project_name: GaRuS
dist: dist

builds:
  - id: default
    main: .
    goos:
      - linux
      - darwin
      - windows
      - freebsd
      - openbsd
      - netbsd
    goarch:
      - amd64
      - arm64
      - 386
      - arm
    ldflags:
      - "-s -w -X main.appVersion={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}"
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*
      - CHANGELOG*
      - docs/**

checksum:
  name_template: "checksums.txt"

nfpms:
  - id: deb
    formats: [deb]
    vendor: GaRuS
    maintainer: "GaRuS <go-while@users.noreply.github.com>"
    description: "GaRuS - Github-actions-Runner-upload-Server"
    homepage: "https://github.com/go-while/GaRuS"
    license: "MIT"
    bindir: /usr/bin
    file_name_template: GaRuS_{{ .Version }}-{{ .Os }}-{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}.deb

release:
  github:
    owner: go-while
    name: GaRuS
  draft: false
  prerelease: auto

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
  use: github
